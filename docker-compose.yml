services:
  profile-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hamed-profile-website
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/portfolio?authSource=admin
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - profile-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: MongoDB container (if you want to run it locally)
  mongodb:
    image: mongo:6.0
    container_name: profile-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=portfolio
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - profile-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "admin", "-p", "password123", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongodb_data:

networks:
  profile-network:
    driver: bridge
